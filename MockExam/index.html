<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TOCFL Band C Mock Exam — Nova Nursery</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="site">
  <div class="site-inner">
    <a class="brand" href="../en/"><img src="../Card/nova-nursery_emoji.png" alt="Nova Nursery" /><span id="brand"></span></a>
    <div class="lang-switch" id="langSwitch"></div>
  </div>
</header>
<main id="home"></main>
<footer class="site">© 2026 LeafLune Universe</footer>

<script src="i18n.js"></script>
<script>
function link(mode, label, desc, secondary, set = "full100") {
  return `<a class="card" href="exam.html?set=${set}&mode=${mode}" style="display:block">
    <h2>${label}</h2>${desc ? `<p>${desc}</p>` : ""}<span class="btn ${secondary ? "secondary" : ""} small">${T().start} →</span></a>`;
}
const PAPER = { en: "Paper {n} (100 questions)", vi: "Đề {n} (100 câu)", zh: "第 {n} 套（100 題）" };
function render() {
  const t = T();
  document.title = t.title + " — Nova Nursery";
  document.getElementById("brand").textContent = t.brand;
  document.getElementById("home").innerHTML = `
    <span class="badge">TOCFL · Band C</span>
    <h1>${t.title}</h1>
    <p class="sub">${t.subtitle}</p>
    ${[["full100", 1], ["full100b", 2], ["full100c", 3]].map(([set, n]) => `
      <h2 style="margin-top:24px">${PAPER[LANG].replace("{n}", n)}</h2>
      ${link("full", t.fullExam, t.fullExamDesc, false, set)}
      <div class="grid">
        ${link("listening", t.listeningOnly, "", true, set)}
        ${link("reading", t.readingOnly, "", true, set)}
      </div>`).join("")}
    <h2 style="margin-top:28px">${t.halfTitle}</h2>
    <div class="grid">
      ${["A", "B", "C", "D", "E", "F"].map((L, i) => link("full", t.halfA.replace("A", L), "", true, "mini0" + (i + 1))).join("")}
    </div>
    <h2 style="margin-top:28px">${t.practiceTitle}</h2>
    <p class="sub">${t.practiceDesc}</p>
    <div class="grid">
      ${link("p-dialogue", t.pDialogue, "", true, "all")}
      ${link("p-monologue", t.pMonologue, "", true, "all")}
      ${link("p-gap", t.pGap, "", true, "all")}
      ${link("p-comp", t.pComp, "", true, "all")}
    </div>
    <p class="notice" style="margin-top:24px">${t.disclaimer}</p>`;
}
mountLangSwitch(document.getElementById("langSwitch"), render);
render();
</script>
</body>
</html>
